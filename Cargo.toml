[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/movement",
    "crates/sensors",
    "crates/transport",
    "crates/viz",
    "crates/server",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
movement = { path = "crates/movement" }
sensors = { path = "crates/sensors" }
transport = { path = "crates/transport" }
viz = { path = "crates/viz" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
bevy = "0.19"
bevy_rapier3d = "0.35"
glam = "0.32"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
